<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Hotel Portal</title>
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

  <div class="container">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="name" id="name" placeholder="Enter Name" required />
      <input type="email" id="email" placeholder="Enter Email" required />
      <input type="password" id="password" placeholder="Enter Password" required />
      <button type="submit">Login</button>
    </form>
    <p id="loginMessage"></p>
    <p>
  <a href="#" class="forgot-link" onclick="openForgotPopup()">
    Forgot Password?
  </a>
</p>
    <p>Don't have an account? <a href="register.html" class="register-link">Register</a></p>
  </div>

  <script src="login.js"></script>
  <div class="booking-popup" id="loginPopup">
  <div class="popup-content">

    <div class="success-icon">
      <i class="fas fa-check"></i>
    </div>

    <h2>Login Successful!</h2>

    <p>Welcome back to RoyalNest Hotel.</p>

    <button onclick="closeLoginPopup()">Continue</button>

  </div>
</div>

<script>
function closeLoginPopup() {
  window.location.href = "hotel.html";
}
</script>
<div class="booking-popup" id="forgotPopup">

  <div class="popup-content">
    <span class="close-popup"
onclick="closeForgotPopup()">
  &times;
</span>

    <div class="success-icon">
      <i class="fas fa-lock"></i>
    </div>

    <h2>Reset Password</h2>

    <input
      type="email"
      id="forgotEmail"
      placeholder="Enter Registered Email"
    >

    <input
      type="password"
      id="newPassword"
      placeholder="Enter New Password"
    >

    <button onclick="resetPassword()">
      Update Password
    </button>

  </div>

</div>
<div id="toastBox"></div>
</body>

</html>
