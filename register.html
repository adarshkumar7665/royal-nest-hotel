<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Hotel Portal</title>
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .login-link {
      color: gold;
    }
  </style>
</head>
<body>
  <div class="container">
    <form id="registerForm">
      <input type="name" id="name" placeholder="Enter Name" required />
      <input type="email" id="email" placeholder="Enter Email" required />
      <input type="password" id="password" placeholder="Enter Password" required />
      <button type="submit">Register</button>
    </form>
    <p id="registerMessage"></p>
    <p>Already have an account? <a href="index.html" class="login-link">Login</a></p>
  </div>

  <script src="register.js"></script>
  <script>
function closeRegisterPopup() {
  document.getElementById("registerPopup").classList.remove("active");
}
</script>
<div class="booking-popup" id="registerPopup">
  <div class="popup-content">

    <div class="success-icon">
      <i class="fas fa-check"></i>
    </div>

    <h2>Registration Successful!</h2>

    <p>Your RoyalNest account has been created.</p>

    <button onclick="closeRegisterPopup()">Continue</button>

  </div>
</div>
<div id="toastBox"></div>
</body>
</html>
